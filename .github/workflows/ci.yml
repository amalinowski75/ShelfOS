name: CI

# Run the same checks we run locally on every push to a pull request. The Python
# and web suites run as independent parallel jobs to cut wall-clock; the `checks`
# gate below aggregates them so the existing required status check keeps working
# without a branch-protection change.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Web UI tests (vitest)
        run: npm test

  # The runtime dependency set, on its own. Every other way of running ShelfOS
  # installs the `dev` extra as well, so a dependency misfiled there works
  # everywhere except the one place it matters — a real deploy, which installs
  # this set and nothing else. httpx sat in `dev` for most of this project's
  # life and the service failed to start the first time anyone installed
  # without it.
  runtime:
    name: Runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without the dev extra
        run: pip install -e .

      - name: Start on the runtime set alone
        # Importing is not enough: it would miss anything the lifespan reaches
        # for. This is what the unit does, minus systemd.
        run: |
          python -c "import app.main"
          DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db" \
          SHELFOS_ATTACHMENTS_DIR="$RUNNER_TEMP/ci-attachments" \
            python -m uvicorn app.main:app --port 9384 --log-level warning &
          for _ in $(seq 1 40); do
            curl -fsS --max-time 2 http://127.0.0.1:9384/health && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:9384/health

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest, so this needs no setup.
      # shelfos.sh installs a service as root; static analysis of it is not
      # optional the way it might be for a two-line helper.
      - name: Parse
        run: |
          bash -n shelfos.sh
          # The installer template. It is a real .sh file with "@TOKEN@" where
          # the values go precisely so this works — a three-hundred-line script
          # inside a Python string could be neither parsed nor read.
          bash -n app/services/label_setup_installer.sh

      - name: Lint (shellcheck)
        # check-unassigned-uppercase is not on by default and is what catches a
        # reference to a variable nothing assigns — which under `set -u` is not
        # a style problem but a crash, and is exactly how a restore came to die
        # after replacing the database and before starting the service.
        run: |
          shellcheck --shell=bash --severity=style \
            --enable=check-unassigned-uppercase \
            shelfos.sh app/services/label_setup_installer.sh

  # Aggregate gate: the branch ruleset requires a status check named `checks`, so
  # keep one that passes only when every suite passes. `if: always()` ensures it
  # runs (and can fail) even when a needed job failed, rather than being skipped.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [python, web, shell, runtime]
    if: always()
    steps:
      # A job added to `needs:` but not to this condition is a job the gate
      # ignores — green whatever it did. Both, every time.
      - name: Require every suite to have succeeded
        run: |
          if [ "${{ needs.python.result }}" != "success" ] \
             || [ "${{ needs.web.result }}" != "success" ] \
             || [ "${{ needs.shell.result }}" != "success" ] \
             || [ "${{ needs.runtime.result }}" != "success" ]; then
            echo "python=${{ needs.python.result }} web=${{ needs.web.result }} shell=${{ needs.shell.result }} runtime=${{ needs.runtime.result }}"
            echo "One or more required suites did not pass."
            exit 1
          fi
          echo "All required suites passed."
