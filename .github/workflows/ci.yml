name: CI

# Run the same checks we run locally on every push to a pull request — but only
# the ones the pull request can actually break. The `changes` job below reads the
# list of changed files and each suite runs only if something it tests was
# touched, so a documentation-only pull request finishes in seconds instead of
# ten minutes. The suites that do run are independent parallel jobs, and the
# `checks` gate at the bottom aggregates them so the existing required status
# check keeps working without a branch-protection change.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# A push to a branch that already has a run in flight makes that run pointless:
# it is testing code nobody will merge. Cancel it and keep the minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, set once here rather than per job. Nothing in this workflow
# writes to the repository; the summaries go to the run's own summary page,
# which needs no token at all.
permissions:
  contents: read

jobs:
  # Which suites this pull request actually needs. A documentation-only change
  # has no business spending ten minutes in pytest, and a change to a single
  # browser script has none spending it either. The decision is made once, here,
  # and every suite below reads it.
  #
  # The file list comes from the pull request API rather than from `git diff`:
  # the checkout action leaves a shallow merge commit behind, so diffing against
  # the base branch needs a full-history fetch first, which is a good part of the
  # cost this job exists to save. `gh` is preinstalled and the read is one call.
  #
  # The filtering lives here and NOT in the workflow's `on: paths:` for one
  # reason: the branch ruleset requires a check named `checks`, and a workflow
  # skipped by `paths:` never reports that check at all — which leaves every
  # documentation pull request blocked forever on a status that will never
  # arrive. A skipped *job* inside a workflow that did run is fine; the gate at
  # the bottom knows the difference between skipped and failed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      shell: ${{ steps.filter.outputs.shell }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - name: Decide which suites to run
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/changed.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[].filename' > "$files" || true

          run_everything() {
            for suite in python web shell runtime; do
              echo "$suite=true" >> "$GITHUB_OUTPUT"
            done
            echo "$1 Running every suite." >> "$GITHUB_STEP_SUMMARY"
          }

          # An empty list means the API told us nothing, not that the pull
          # request changes nothing. Err towards running too much.
          if [ ! -s "$files" ]; then
            run_everything "Could not read the list of changed files."
            exit 0
          fi

          # A change to CI itself is a change to every suite: the whole point of
          # such a pull request is watching them all run under the new rules.
          if grep -qE '^\.github/workflows/' "$files"; then
            run_everything "The workflow itself changed."
            exit 0
          fi

          # The Python suite is blind to tests/js — those files are vitest's and
          # nothing under them is collected by pytest — so they are stripped
          # before the Python question is asked. Everything else under tests/ is
          # fair game, fixtures and sample invoices included.
          #
          # grep -q closes the pipe as soon as it matches, so each list is built
          # into a file first: `grep -v … | grep -q …` can report failure for a
          # match, having killed the left-hand side with SIGPIPE under the
          # `pipefail` set above.
          python_files="$RUNNER_TEMP/changed-python.txt"
          grep -vE '^tests/js/' "$files" > "$python_files" || true

          decide() {  # decide <suite> <file list> <pattern>
            local suite="$1" list="$2" pattern="$3" verdict=false
            if [ -s "$list" ] && grep -qE "$pattern" "$list"; then
              verdict=true
            fi
            echo "$suite=$verdict" >> "$GITHUB_OUTPUT"
            echo "| $suite | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Suites selected for this pull request"
            echo
            echo "| Suite | Running |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Templates count as Python because the server-side tests assert on
          # the rendered HTML: a renamed block breaks pytest, not vitest.
          # pyproject.toml carries the ruff and mypy settings as well as the
          # dependency sets, so it belongs to both Python jobs.
          #
          # Shell files and deploy/ are in this list as well as in the shell
          # one, and that is not belt and braces: test_shelfos_script.py reads
          # shelfos.sh, deploy/tunnel-keys.sh and the systemd units line by
          # line, and test_label_setup.py does the same to the installer
          # template. shellcheck is not the only thing an edit there can break.
          decide python "$python_files" \
            '^(app/.*\.(py|html)|tests/.*|scripts/.*\.py|pyproject\.toml|deploy/.*|.*\.sh)$'
          decide web "$files" \
            '^(app/web/static/.*\.js|tests/js/.*|package(-lock)?\.json|vitest\.config\.js)$'
          decide shell "$files" \
            '\.sh$'
          decide runtime "$files" \
            '^(app/.*\.py|pyproject\.toml)$'

          {
            echo
            echo "<details><summary>Changed files</summary>"
            echo
            sed 's/^/- `/; s/$/`/' "$files"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app

      # -n auto runs the suite across the runner's cores. Every test builds
      # its own SQLite database under its own tmp_path, so there is nothing to
      # share and nothing to serialise; the only thing one worker bought was
      # wall-clock. On this runner it is the difference between about ten
      # minutes and about two.
      #
      # --junitxml feeds the summary step below. --durations names the ten
      # slowest tests in the log, which is how a suite that has quietly grown a
      # sixty-second test gets noticed before it is the whole run.
      #
      # Coverage is measured but nothing is gated on the number: a threshold
      # that fails the build turns every honest refactor into a fight with CI.
      # The figure belongs in front of the reader, not in the exit status.
      #
      # The elapsed time is measured here rather than read back out of the
      # report: under -n auto the duration pytest writes to its JUnit file is
      # neither the wall clock nor the sum of the tests, and it called a
      # 90-second run 28 seconds. Written before the exit so a failing suite
      # still gets a timed summary.
      - name: Tests (pytest)
        run: |
          started=$SECONDS
          status=0
          pytest \
            -n auto \
            --junitxml=junit/pytest.xml \
            --durations=10 \
            --cov=app \
            --cov-report=term \
            --cov-report=json:coverage.json || status=$?
          echo "PYTEST_ELAPSED=$((SECONDS - started))" >> "$GITHUB_ENV"
          exit $status

      # if: always() — the summary is most wanted precisely when the step above
      # failed. Without it the run that needs a table is the one run that has
      # none.
      - name: Summarise
        if: always()
        run: |
          # ${VAR:+--elapsed VAR} passes the flag only when the variable is
          # set, so a cancelled run that never reached the echo above leaves
          # the report's own figure in place instead of claiming zero.
          python scripts/ci_summary.py --title "Python (pytest)" \
            ${PYTEST_ELAPSED:+--elapsed "$PYTEST_ELAPSED"} junit/pytest.xml
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          # Coverage lives beside the test table rather than in a comment on the
          # pull request: a comment needs write permission on the PR, and this
          # is the same click away.
          import json, pathlib
          report = pathlib.Path("coverage.json")
          if report.is_file():
              covered = json.loads(report.read_text())["totals"]["percent_covered"]
              print(f"**Coverage:** {covered:.1f}% of `app`\n")
          PY

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The github-actions reporter is built into Vitest and puts a failure
      # annotation on the offending line in the diff, so a red run is readable
      # from the Files-changed tab without opening the log. The junit reporter
      # alongside it feeds the summary step.
      #
      # `default` is listed because naming any reporter on the CLI REPLACES the
      # defaults rather than adding to them. Without it the step's log holds
      # one line — "JUNIT report written to …" — since junit writes only to its
      # file and github-actions emits only annotations. The log is the fallback
      # for every case the summary cannot cover, so it has to keep the list.
      - name: Web UI tests (vitest)
        run: >
          npm test --
          --reporter=default
          --reporter=github-actions
          --reporter=junit
          --outputFile=junit/vitest.xml

      - name: Summarise
        if: always()
        run: python3 scripts/ci_summary.py --title "Web (vitest)" junit/vitest.xml

  # The runtime dependency set, on its own. Every other way of running ShelfOS
  # installs the `dev` extra as well, so a dependency misfiled there works
  # everywhere except the one place it matters — a real deploy, which installs
  # this set and nothing else. httpx sat in `dev` for most of this project's
  # life and the service failed to start the first time anyone installed
  # without it.
  runtime:
    name: Runtime dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without the dev extra
        run: pip install -e .

      - name: Start on the runtime set alone
        # Importing is not enough: it would miss anything the lifespan reaches
        # for. This is what the unit does, minus systemd.
        run: |
          python -c "import app.main"
          DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db" \
          SHELFOS_ATTACHMENTS_DIR="$RUNNER_TEMP/ci-attachments" \
            python -m uvicorn app.main:app --port 9384 --log-level warning &
          for _ in $(seq 1 40); do
            curl -fsS --max-time 2 http://127.0.0.1:9384/health && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:9384/health

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest, so this needs no setup.
      # shelfos.sh installs a service as root; static analysis of it is not
      # optional the way it might be for a two-line helper.
      - name: Parse
        run: |
          bash -n shelfos.sh
          # The installer template. It is a real .sh file with "@TOKEN@" where
          # the values go precisely so this works — a three-hundred-line script
          # inside a Python string could be neither parsed nor read.
          bash -n app/services/label_setup_installer.sh

      - name: Lint (shellcheck)
        # check-unassigned-uppercase is not on by default and is what catches a
        # reference to a variable nothing assigns — which under `set -u` is not
        # a style problem but a crash, and is exactly how a restore came to die
        # after replacing the database and before starting the service.
        run: |
          shellcheck --shell=bash --severity=style \
            --enable=check-unassigned-uppercase \
            shelfos.sh app/services/label_setup_installer.sh

  # Aggregate gate: the branch ruleset requires a status check named `checks`, so
  # keep one that passes only when every suite that ran passed. `if: always()`
  # ensures it runs (and can fail) even when a needed job failed, rather than
  # being skipped along with it.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [changes, python, web, shell, runtime]
    if: always()
    steps:
      # A job added to `needs:` but not to this condition is a job the gate
      # ignores — green whatever it did. Both, every time.
      #
      # `skipped` passes, and has to: it is how a suite says the pull request
      # does not touch anything it tests. Only `failure` and `cancelled` are
      # held against a suite — so a run cancelled by the concurrency rule above
      # is not mistaken for a run that had nothing to do. `changes` itself is
      # judged the other way round, on success alone: if it fell over, every
      # suite skipped for want of an answer and none of those skips mean a
      # thing.
      - name: Require every suite that ran to have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          PYTHON: ${{ needs.python.result }}
          WEB: ${{ needs.web.result }}
          SHELL: ${{ needs.shell.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          echo "changes=$CHANGES python=$PYTHON web=$WEB shell=$SHELL runtime=$RUNTIME"
          if [ "$CHANGES" != "success" ]; then
            echo "Could not decide which suites to run."
            exit 1
          fi
          failed=
          for suite in PYTHON WEB SHELL RUNTIME; do
            case "${!suite}" in
              success|skipped) ;;
              *) failed="$failed $suite" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "These suites did not pass:$failed"
            exit 1
          fi
          echo "Every suite that ran passed."
