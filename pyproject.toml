[project]
name = "shelfos"
version = "1.0.0"
description = "Lightweight electronic component inventory and information management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pillow>=11",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "itsdangerous>=2.2",
    # A runtime dependency, not a testing one: url_fetch and every shop
    # provider import it at module scope, so the app does not start without it.
    # It lived in the dev extra for most of this project's life and nobody
    # noticed, because every way of running ShelfOS installed that extra —
    # until deploy, which correctly installs the runtime set alone.
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "segno>=1.6",
    # Brother QL raster protocol, for printing location labels on a label
    # printer (spec §7). A maintained fork of the abandoned "brother-ql"; it
    # imports as ``brother_ql``. Required rather than optional because its label
    # table is the source of truth for a tape's printable width — a copy of that
    # table here could drift, and a wrong width prints noise onto real tape.
    # Only its pure-python raster half is used (labels/raster/conversion); the
    # USB backends, and so pyusb/libusb, are never imported.
    "brother_ql_next>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Turns a pytest failure into a GitHub Actions annotation on the failing
    # line, so a red CI run is readable from the pull request's diff without
    # opening the log. A no-op outside Actions, so it costs a local run
    # nothing.
    "pytest-github-actions-annotate-failures>=0.2",
    # Runs the suite across the runner's cores. The suite is CPU-bound and
    # share-nothing (every test builds its own SQLite database and tmp_path),
    # so the only thing serial execution bought was wall-clock.
    "pytest-xdist>=3.6",
    "mypy>=1.13",
    "ruff>=0.8",
    "black>=24.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# The installer template is a shell script that lives beside the code rendering
# it, so it can be parsed and shellchecked in CI like any other script. Without
# this it would be left out of a built wheel and the download would 503.
[tool.setuptools.package-data]
"app.services" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    # Starlette's TestClient still imports httpx; not actionable from our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI relies on calling Depends()/Query() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest empties SHELFOS_* out of the environment before importing anything
# under `app`, which is the whole point of it — so its imports come after code.
"tests/conftest.py" = ["E402"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# brother_ql_next ships no type information and no stubs exist for it.
module = "brother_ql.*"
ignore_missing_imports = true
